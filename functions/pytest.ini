[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (individual components)
    integration: Integration tests (end-to-end flows)
    live: Tests that require real OCI connectivity
    slow: Slow-running tests
addopts =
    --strict-markers
    --tb=short
    -ra
log_cli_level = INFO
timeout = 120
